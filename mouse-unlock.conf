# mouse-unlock configuration
#
# Set your click pattern with the setup tool (it writes pattern_hash for you):
#   sudo mouse-unlock-setup
# Then apply changes with:  sudo systemctl restart mouse-unlock
#
# Keep this file root-only (chmod 0600) — it holds the secret's hash.

# Argon2 hash of your click sequence. Empty = no pattern set yet (daemon won't unlock).
# Do not edit by hand; use the setup tool.
pattern_hash =

# Max time (milliseconds) between two consecutive clicks. Longer -> attempt resets.
timeout_ms = 2000

# Command to run when the pattern matches. Default uses systemd-logind (any desktop).
unlock_cmd = loginctl unlock-sessions

# Brute-force lockout. Failures are counted only while the screen is actually locked,
# so normal clicking while unlocked never triggers a lockout. After max_failures wrong
# attempts the daemon backs off exponentially from lockout_base_ms up to lockout_max_ms.
max_failures = 5
lockout_base_ms = 2000
lockout_max_ms = 300000

# Optional second factor: only unlock if this USB device is present.
# Format: vendor:product  or  vendor:product:serial  (lowercase hex). Empty = disabled.
# Pick one from the setup tool ([k] USB factor).
require_usb =
