# mouse-unlock configuration
# Edit this file, then run: sudo systemctl restart mouse-unlock

# Secret click sequence. L = left button, R = right button, M = middle button.
# You can write it joined "LLRRL" or separated "L,L,R,R,L".
pattern = LLRRL

# Max time (milliseconds) between two consecutive clicks. Longer -> sequence resets.
timeout_ms = 2000

# Command to run when the pattern matches. Default uses systemd-logind (works on any desktop).
unlock_cmd = loginctl unlock-sessions

# --- Example fallback for multiple environments (uncomment to use; chain with "||" or ";") ---
# unlock_cmd = loginctl unlock-sessions || loginctl unlock-session $(loginctl list-sessions --no-legend | awk 'NR==1{print $1}')
